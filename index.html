<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZarCoin (ZAR) - نصف قیمت دلار</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.97);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.55);
      border: 1px solid #334155;
      text-align: center;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .ticker {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .price-box {
      background: #0f172a;
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 18px;
    }
    .label {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .main-price {
      font-size: 2.2rem;
      font-weight: 700;
      color: #22c55e;
      direction: ltr;
      letter-spacing: -0.5px;
    }
    .sub-price {
      font-size: 1.15rem;
      color: #cbd5e1;
      margin-top: 10px;
      direction: ltr;
    }
    .usd-box {
      background: #1e293b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .usd-price {
      font-size: 1.35rem;
      color: #38bdf8;
      direction: ltr;
      font-weight: 600;
    }
    .info {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.75;
      margin-top: 8px;
    }
    .status {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 12px;
    }
    .update {
      margin-top: 22px;
      font-size: 0.82rem;
      color: #64748b;
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 26px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.03); }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>ZarCoin</h1>
    <div class="ticker">ZAR • همیشه نصف قیمت دلار</div>

    <div class="price-box">
      <div class="label">قیمت ۱ زارکوین</div>
      <div class="main-price" id="price-toman">در حال بارگذاری...</div>
      <div class="sub-price" id="price-rial">—</div>
    </div>

    <div class="usd-box">
      <div class="label">معادل دلاری</div>
      <div class="usd-price" id="price-usd">۰.۵۰ دلار</div>
    </div>

    <div class="info">
      قیمت همیشه دقیقاً <strong>نصف نرخ دلار آزاد</strong> است.<br>
      نرخ از بازار آزاد ایران محاسبه می‌شود.
    </div>

    <div class="status" id="rate-status">در حال دریافت نرخ دلار...</div>

    <button class="btn" onclick="loadAndUpdate()">به‌روزرسانی قیمت</button>

    <div class="update">
      <span class="live-dot"></span>
      آخرین به‌روزرسانی: <span id="last-update">—</span>
    </div>
  </div>

  <script>
    // نرخ پیش‌فرض دلار آزاد (تومان) - اکتبر ۲۰۲۶
    let usdToToman = 263800;

    function formatFa(num) {
      return Math.round(num).toLocaleString('fa-IR');
    }

    function renderPrice() {
      const zarToman = usdToToman / 2;
      const zarRial  = zarToman * 10;

      document.getElementById('price-toman').textContent = formatFa(zarToman) + ' تومان';
      document.getElementById('price-rial').textContent  = formatFa(zarRial)  + ' ریال';
      document.getElementById('price-usd').textContent   = '۰.۵۰ دلار';
      document.getElementById('last-update').textContent = new Date().toLocaleString('fa-IR');
    }

    async function tryFetchLiveRate() {
      // تلاش برای گرفتن نرخ از منابع عمومی با CORS proxy
      // توجه: نرخ‌های رسمی معمولاً پایین‌تر از بازار آزاد هستند
      const proxies = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?'
      ];

      // یک API عمومی ساده (نرخ میانی جهانی - برای دمو)
      const target = encodeURIComponent('https://open.er-api.com/v6/latest/USD');

      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy + target, { signal: AbortSignal.timeout(5000) });
          if (!res.ok) continue;
          const data = await res.json();
          // این API نرخ رسمی/میانی می‌دهد. برای بازار آزاد ایران عدد را نگه می‌داریم
          // چون نرخ آزاد بسیار بالاتر است، از مقدار پیش‌فرض استفاده می‌کنیم
          // و فقط وضعیت را به‌روز می‌کنیم
          document.getElementById('rate-status').textContent =
            'نرخ پایه بازار آزاد استفاده شد (برای دقت بیشتر بک‌اند نیاز است)';
          return false;
        } catch (e) {
          continue;
        }
      }
      document.getElementById('rate-status').textContent =
        'از نرخ ذخیره شده بازار آزاد استفاده شد';
      return false;
    }

    async function loadAndUpdate() {
      document.getElementById('rate-status').textContent = 'در حال دریافت نرخ...';
      await tryFetchLiveRate();
      renderPrice();
    }

    // بارگذاری اولیه
    loadAndUpdate();

    // به‌روزرسانی خودکار هر ۶۰ ثانیه
    setInterval(loadAndUpdate, 60000);
  </script>
</body>
</html>
